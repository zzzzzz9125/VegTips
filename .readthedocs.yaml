version: 2

build:
    os: ubuntu-24.04
    tools:
        nodejs: "20"
    jobs:
        install:
            - npm ci
        build:
            html:
                - npm run docs:build
                - mkdir -p "$READTHEDOCS_OUTPUT/html"
                - cp -a docs/.vitepress/dist/. "$READTHEDOCS_OUTPUT/html/"